[package]
name = "wshm-core"
version = "0.31.5"
edition = "2021"
description = "Core library for wshm"
license = "SSPL-1.0"

[[bin]]
name = "wshm"
path = "src/main.rs"

[features]
default = []

# Export sinks (cloud storage)
export-s3 = ["dep:aws-sdk-s3", "dep:aws-config"]
export-gcs = ["dep:google-cloud-storage"]

# Export sinks (databases)
# Note: PostgreSQL backend and SQLite→Postgres migration are wshm-pro
# features and intentionally absent from OSS.
export-elastic = ["dep:elasticsearch"]
export-opensearch = ["dep:opensearch"]
export-mongodb = ["dep:mongodb"]
export-mysql = ["dep:mysql_async"]

# Vault providers
vault-hashicorp = ["dep:vaultrs"]
vault-aws = ["dep:aws-sdk-secretsmanager", "dep:aws-config"]
vault-gcp = ["dep:google-cloud-secretmanager-v1"]

# Convenience bundles
export-all = [
    "export-s3", "export-gcs",
    "export-elastic", "export-opensearch", "export-mongodb",
    "export-mysql",
]
vault-all = ["vault-hashicorp", "vault-aws", "vault-gcp"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
octocrab = "0.44"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
git2 = "0.19"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
encoding_rs = "0.8"
dirs = "6.0.0"
getrandom = "0.2"
ureq = { version = "2", features = ["json"] }
hostname = "0.4"
base64 = "0.22"
regex = "1.12.3"
axum = "0.8"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
flate2 = "1"
tar = "0.4"
zip = "2"
async-trait = "0.1"
is-terminal = "0.4"
zeroize = "1"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
# Local accounts: password hashing + secure random generation.
argon2 = "0.5"
rand = "0.8"
# Encrypted secret vault (AES-256-GCM with master key from WSHM_MASTER_KEY).
aes-gcm = "0.10"

# Optional: Export - Cloud Storage
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
google-cloud-storage = { version = "1", optional = true }

# Optional: Export - Databases
elasticsearch = { version = "9.1.0-alpha.1", optional = true }
opensearch = { version = "2", optional = true }
mongodb = { version = "3", optional = true }
mysql_async = { version = "0.36", optional = true }

# Optional: Vault
vaultrs = { version = "0.7", optional = true }
aws-sdk-secretsmanager = { version = "1", optional = true }
google-cloud-secretmanager-v1 = { version = "1", optional = true }
mime_guess = "2"
rust-embed = "8"
urlencoding = "2.1.3"
futures = "0.3.32"
ratatui = "0.29"
crossterm = "0.28"

# musl (Alpine) has no system OpenSSL for libgit2's HTTPS transport: build the
# vendored copy there, and only there — glibc/macOS/Windows builds are unaffected.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }
